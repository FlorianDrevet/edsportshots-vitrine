<header class="sticky top-0 z-40 border-b-2 border-border bg-bg">
  <div class="mx-auto flex h-[72px] max-w-[1440px] items-center justify-between px-5 md:h-[92px] md:px-14">
    <a routerLink="/" (click)="close()" class="flex items-center gap-3">
      <img src="logo-ed.svg" alt="ED" class="h-9 w-9 md:h-10 md:w-10" />
      <span class="font-display text-base tracking-tight text-text md:text-[19px]">SPORTSHOTS</span>
    </a>

    <nav class="hidden items-center gap-8 lg:flex">
      <a
        routerLink="/galerie"
        routerLinkActive="text-accent"
        class="text-sm font-semibold uppercase tracking-wider text-text-muted hover:text-accent"
        >Le book</a
      >
      <a
        routerLink="/reportages"
        routerLinkActive="text-accent"
        class="text-sm font-semibold uppercase tracking-wider text-text-muted hover:text-accent"
        >Reportages</a
      >
      <a
        routerLink="/"
        fragment="apropos"
        class="text-sm font-semibold uppercase tracking-wider text-text-muted hover:text-accent"
        >À propos</a
      >
      <a
        routerLink="/prestations"
        routerLinkActive="text-accent"
        class="text-sm font-semibold uppercase tracking-wider text-text-muted hover:text-accent"
        >Formules</a
      >
      <a
        routerLink="/prestations"
        fragment="contact"
        class="bg-accent px-6 py-3.5 text-sm font-bold uppercase tracking-wider text-bg hover:opacity-90"
        >Réserver un match</a
      >
    </nav>

    <button
      type="button"
      (click)="toggle()"
      [attr.aria-expanded]="isOpen()"
      aria-label="Ouvrir le menu"
      class="flex h-11 w-11 items-center justify-center lg:hidden"
    >
      @if (!isOpen()) {
        <svg width="22" height="16" viewBox="0 0 22 16" fill="none" aria-hidden="true">
          <path d="M0 1h22M0 8h22M0 15h22" stroke="#F4F4F2" stroke-width="2" />
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <line x1="2" y1="2" x2="18" y2="18" stroke="#F4F4F2" stroke-width="2.4" />
          <line x1="18" y1="2" x2="2" y2="18" stroke="#F4F4F2" stroke-width="2.4" />
        </svg>
      }
    </button>
  </div>

  @if (isOpen()) {
    <nav
      aria-label="Navigation principale"
      class="flex flex-col gap-1 border-t-2 border-border bg-bg px-5 pb-8 pt-5 lg:hidden"
    >
      <a
        routerLink="/"
        (click)="close()"
        routerLinkActive="text-accent"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex h-[64px] items-center border-b-2 border-border font-display text-3xl uppercase tracking-tight text-text"
        >Accueil</a
      >
      <a
        routerLink="/galerie"
        (click)="close()"
        routerLinkActive="text-accent"
        class="flex h-[64px] items-center border-b-2 border-border font-display text-3xl uppercase tracking-tight text-text"
        >Le book</a
      >
      <a
        routerLink="/reportages"
        (click)="close()"
        routerLinkActive="text-accent"
        class="flex h-[64px] items-center border-b-2 border-border font-display text-3xl uppercase tracking-tight text-text"
        >Reportages</a
      >
      <a
        routerLink="/"
        fragment="apropos"
        (click)="close()"
        class="flex h-[64px] items-center border-b-2 border-border font-display text-3xl uppercase tracking-tight text-text"
        >À propos</a
      >
      <a
        routerLink="/prestations"
        (click)="close()"
        routerLinkActive="text-accent"
        class="flex h-[64px] items-center border-b-2 border-border font-display text-3xl uppercase tracking-tight text-text"
        >Formules</a
      >
      <a
        routerLink="/prestations"
        fragment="contact"
        (click)="close()"
        class="mt-6 flex h-14 items-center justify-center bg-accent text-sm font-bold uppercase tracking-wider text-bg"
        >Réserver un match</a
      >
      <a
        [href]="content.site.instagramUrl"
        class="mt-3 flex h-12 items-center justify-center gap-2 border-2 border-border-strong text-sm font-bold uppercase tracking-wider text-text"
        >{{ content.site.instagramHandle }}</a
      >
    </nav>
  }
</header>
