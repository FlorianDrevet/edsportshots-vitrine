name: Deploy EDSPORTSHOTS — Chrono

on:
  push:
    branches:
      - design-chrono
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CHRONO }}
          action: upload
          app_location: "/"
          output_location: ""
          skip_app_build: true

